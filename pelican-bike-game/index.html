<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>鹈鹕骑车记 · Pelican Ride</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1026; font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif; }
  #game-canvas { position:fixed; inset:0; display:block; }
  /* ---------- HUD ---------- */
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 18px; pointer-events:none; z-index:10; }
  .pill { background:rgba(10,16,40,.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.18); border-radius:999px; color:#fff;
    padding:8px 16px; font-size:18px; letter-spacing:.5px; display:flex; align-items:center; gap:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .pill small { font-size:12px; opacity:.7; letter-spacing:2px; }
  #score-pill { font-size:22px; color:#ffe66d; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  #combo { position:fixed; top:78px; left:50%; transform:translateX(-50%) scale(.8); opacity:0;
    color:#fff; font-size:30px; text-shadow:0 0 18px #ff9f1c,0 2px 0 #000; transition:all .25s ease; z-index:10; pointer-events:none; }
  #combo.show { opacity:1; transform:translateX(-50%) scale(1); }
  #hearts { display:flex; gap:6px; font-size:20px; }
  /* ---------- 底部操作提示 ---------- */
  #controls-hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:10;
    display:flex; gap:10px; pointer-events:none; }
  .key { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff;
    border-radius:12px; padding:7px 12px; font-size:13px; backdrop-filter:blur(8px); white-space:nowrap; }
  .key b { background:#fff; color:#111; border-radius:6px; padding:1px 7px; margin-right:6px; }
  /* ---------- 覆盖层 ---------- */
  .overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, rgba(255,159,28,.25), transparent 60%),
               linear-gradient(180deg, rgba(8,12,35,.55), rgba(8,12,35,.82));
    backdrop-filter:blur(6px); transition:opacity .4s ease; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .card { text-align:center; color:#fff; max-width:560px; width:calc(100% - 40px);
    background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.22); border-radius:28px; padding:40px 36px 32px;
    box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.3); }
  .badge { display:inline-block; background:linear-gradient(90deg,#ff9f1c,#ff5d8f); border-radius:999px;
    padding:6px 18px; font-size:14px; letter-spacing:3px; margin-bottom:14px; box-shadow:0 6px 20px rgba(255,93,143,.4); }
  h1.title { font-size:52px; line-height:1.1; margin-bottom:6px;
    background:linear-gradient(180deg,#fff 20%,#ffe66d 55%,#ff9f1c 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.4)); }
  h1.title span { font-size:60px; }
  p.sub { opacity:.85; font-size:17px; line-height:1.7; margin:10px 0 18px; }
  p.sub em { color:#7bf1ff; font-style:normal; }
  .btn { pointer-events:auto; cursor:pointer; border:none; font-family:inherit;
    font-size:24px; color:#3a1500; padding:14px 52px; border-radius:999px; margin-top:8px;
    background:linear-gradient(180deg,#ffe66d,#ffb700); box-shadow:0 8px 0 #b97a00, 0 16px 32px rgba(255,183,0,.4);
    transition:transform .12s ease, box-shadow .12s ease; }
  .btn:hover { transform:translateY(-2px) scale(1.03); }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #b97a00; }
  .rules { display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
  .rule { background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.15); border-radius:14px;
    padding:10px 14px; font-size:14px; line-height:1.5; min-width:130px; }
  .rule i { font-style:normal; font-size:24px; display:block; }
  #final-score { font-size:64px; color:#ffe66d; text-shadow:0 4px 0 rgba(0,0,0,.5), 0 0 30px rgba(255,230,109,.6); }
  #best-score { opacity:.7; margin-top:4px; }
  #mobile-btns { position:fixed; bottom:64px; left:0; right:0; z-index:11; display:none;
    justify-content:space-between; padding:0 20px; pointer-events:none; }
  #mobile-btns button { pointer-events:auto; width:64px; height:64px; border-radius:50%; border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.15); backdrop-filter:blur(8px); color:#fff; font-size:26px; }
  @media (max-width:640px){
    h1.title{font-size:38px} #controls-hint{display:none} #mobile-btns{display:flex}
    .pill{font-size:15px; padding:6px 12px} #score-pill{font-size:18px}
  }
  /* 受伤闪屏 */
  #flash { position:fixed; inset:0; background:radial-gradient(ellipse,transparent 40%,rgba(255,30,60,.55)); opacity:0; pointer-events:none; z-index:15; transition:opacity .3s; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud">
  <div class="pill"><small>SCORE</small><span id="score-pill">0</span></div>
  <div class="pill">🐟 <span id="fish">0</span> &nbsp;·&nbsp; ⚡ <span id="speed-label">1</span></div>
  <div class="pill"><span id="hearts">❤️❤️❤️</span></div>
</div>
<div id="combo">连吃 +5 !</div>
<div id="flash"></div>

<div id="controls-hint">
  <div class="key"><b>← →</b>换道</div>
  <div class="key"><b>空格</b>跳跃</div>
  <div class="key"><b>↓</b>压低滑行</div>
  <div class="key"><b>P</b>暂停</div>
</div>

<div id="mobile-btns">
  <div style="display:flex;gap:12px"><button id="btn-left">◀</button><button id="btn-right">▶</button></div>
  <div style="display:flex;gap:12px"><button id="btn-down">▼</button><button id="btn-jump">▲</button></div>
</div>

<!-- 开始界面 -->
<div class="overlay" id="start-screen">
  <div class="card">
    <div class="badge">THREE.JS · 海岸骑行</div>
    <h1 class="title"><span>🚲</span><br>鹈鹕骑车记</h1>
    <p class="sub">一只爱吃鱼的鹈鹕，蹬着小单车沿着<em>日落海岸公路</em>狂飙！<br>左右换道躲汽车，跳起来吃<em>飞鱼</em>，别撞上路障哦～</p>
    <button class="btn" id="start-btn">出 发 ▶</button>
    <div class="rules">
      <div class="rule"><i>🐟</i>吃鱼 +10<br>连吃有加成</div>
      <div class="rule"><i>🚗</i>躲开汽车<br>撞到掉一颗心</div>
      <div class="rule"><i>🚧</i>跳过路障<br>空格 / 上键</div>
    </div>
  </div>
</div>

<!-- 结束界面 -->
<div class="overlay hidden" id="over-screen">
  <div class="card">
    <div class="badge">GAME OVER</div>
    <h1 class="title" style="font-size:40px">鹈鹕摔了个屁股墩！</h1>
    <div id="final-score">0</div>
    <div id="best-score">历史最佳：0</div>
    <p class="sub" id="over-comment"></p>
    <button class="btn" id="restart-btn">再来一次 ↻</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ================= 基础设置 ================= */
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2350);
scene.fog = new THREE.Fog(0x2b3a6e, 30, 130);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 400);
camera.position.set(0, 5.2, 9.5);
camera.lookAt(0, 1.8, -8);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* 灯光：日落感 */
scene.add(new THREE.HemisphereLight(0xffd9b0, 0x223355, .85));
const sun = new THREE.DirectionalLight(0xffb26b, 1.6);
sun.position.set(-18, 22, -40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-30; sun.shadow.camera.right=30;
sun.shadow.camera.top=30; sun.shadow.camera.bottom=-30;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x7bf1ff, .5);
rim.position.set(15, 10, 10); scene.add(rim);

/* 落日 + 天空渐变球 */
{
  const skyGeo = new THREE.SphereGeometry(220, 16, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: { top:{value:new THREE.Color(0x0b1026)}, mid:{value:new THREE.Color(0xff5d8f)}, bot:{value:new THREE.Color(0xffb35d)} },
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vP; uniform vec3 top,mid,bot;
      void main(){ float h=normalize(vP).y; vec3 c=h>0.15?mix(mid,top,smoothstep(.15,.7,h)):mix(bot,mid,smoothstep(-.1,.15,h));
      gl_FragColor=vec4(c,1.);}`
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
  const sunBall = new THREE.Mesh(new THREE.SphereGeometry(9,32,32),
    new THREE.MeshBasicMaterial({ color:0xffdf8a, fog:false }));
  sunBall.position.set(-28, 12, -150); scene.add(sunBall);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(14,32,32),
    new THREE.MeshBasicMaterial({ color:0xff9f1c, transparent:true, opacity:.35, fog:false }));
  glow.position.copy(sunBall.position); scene.add(glow);
}

/* ================= 海洋 / 沙滩 / 公路 ================= */
const ROAD_W = 9, LANE_X = [-3, 0, 3];
function flat(color, w, l, x, z, y=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,l),
    new THREE.MeshStandardMaterial({ color, roughness:.95 }));
  m.rotation.x = -Math.PI/2; m.position.set(x,y,z); m.receiveShadow = true; scene.add(m); return m;
}
flat(0x1e6fa8, 90, 300, -32, -60, -.15);   // 左海
flat(0x1e6fa8, 90, 300,  32, -60, -.15);   // 右海
flat(0xf2d8a0, 14, 300, -11.5, -60, -.05); // 沙滩
flat(0xf2d8a0, 14, 300,  11.5, -60, -.05);
const road = flat(0x2e3448, ROAD_W+1.6, 300, 0, -60, 0);

// 车道线（可滚动纹理感：用小白块循环）
const dashGeo = new THREE.BoxGeometry(.18, .02, 1.6);
const dashMat = new THREE.MeshBasicMaterial({ color:0xffe66d });
const dashes = [];
for(let i=0;i<40;i++){
  for(const x of [-1.5, 1.5]){
    const d = new THREE.Mesh(dashGeo, dashMat);
    d.position.set(x, .02, 20 - i*6); scene.add(d); dashes.push(d);
  }
}
// 海浪高光条
const waveMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.22 });
const waves = [];
for(let i=0;i<26;i++){
  const w = new THREE.Mesh(new THREE.PlaneGeometry(2+Math.random()*5,.28), waveMat);
  w.rotation.x=-Math.PI/2;
  w.position.set((Math.random()<.5?-1:1)*(16+Math.random()*22), -.08, 20-Math.random()*160);
  scene.add(w); waves.push(w);
}

/* 棕榈树 + 云 + 海鸥（装饰） */
const decor = new THREE.Group(); scene.add(decor);
function palm(x,z,s=1){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.28*s,5*s,7),
    new THREE.MeshStandardMaterial({color:0x8a5a33, roughness:.9}));
  trunk.position.y=2.5*s; trunk.castShadow=true; g.add(trunk);
  const leafMat = new THREE.MeshStandardMaterial({color:0x2fbf71, roughness:.8});
  for(let i=0;i<6;i++){
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(.5*s,3.2*s,5), leafMat);
    const a = i/6*Math.PI*2;
    leaf.position.set(Math.cos(a)*1.3*s, 5*s, Math.sin(a)*1.3*s);
    leaf.rotation.z = Math.cos(a)*1.2; leaf.rotation.x = -Math.sin(a)*1.2;
    leaf.castShadow=true; g.add(leaf);
  }
  g.position.set(x,0,z); decor.add(g); return g;
}
const palms=[];
for(let i=0;i<14;i++){ palms.push(palm(-9-Math.random()*3, 15-i*13)); palms.push(palm(9+Math.random()*3, 8-i*13)); }

function cloud(x,y,z,s=1){
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({color:0xffffff, roughness:1, transparent:true, opacity:.92});
  [[0,0,0,2.2],[1.8,.3,0,1.6],[-1.8,.2,0,1.4],[.6,.8,0,1.2]].forEach(([cx,cy,cz,r])=>{
    const b=new THREE.Mesh(new THREE.SphereGeometry(r*s,12,12),m); b.position.set(cx*s,cy*s,cz); g.add(b);
  });
  g.position.set(x,y,z); scene.add(g); return g;
}
const clouds=[];
for(let i=0;i<8;i++) clouds.push(cloud((Math.random()-.5)*120, 16+Math.random()*14, -30-Math.random()*100, 1+Math.random()*1.6));

const gulls=[];
{
  const gm = new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide});
  for(let i=0;i<5;i++){
    const g = new THREE.Group();
    const wgeo = new THREE.PlaneGeometry(1.4,.3);
    const l = new THREE.Mesh(wgeo,gm), r = new THREE.Mesh(wgeo,gm);
    l.position.x=-.7; r.position.x=.7; g.add(l,r); g.userData={l,r,ph:Math.random()*6};
    g.position.set((Math.random()-.5)*50, 10+Math.random()*8, -20-Math.random()*50);
    scene.add(g); gulls.push(g);
  }
}

/* ================= 鹈鹕 + 自行车 ================= */
const player = new THREE.Group(); scene.add(player);
const bike = new THREE.Group(); player.add(bike);

// —— 自行车 ——（车头朝 -Z，镜头在 +Z 从后方跟拍，只看到鹈鹕背影）
const frameMat = new THREE.MeshPhysicalMaterial({color:0xe63946, roughness:.25, metalness:.35, clearcoat:.8, clearcoatRoughness:.3});
const darkMat  = new THREE.MeshStandardMaterial({color:0x222633, roughness:.55, metalness:.5});
const chromeMat= new THREE.MeshStandardMaterial({color:0xc0c8d8, roughness:.25, metalness:.85});
function tube(a,b,r=.06,mat=frameMat){
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10), mat);
  m.position.copy(a).addScaledVector(dir,.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  m.castShadow=true; bike.add(m); return m;
}
const FZ = -1.1, RZ = 1.05; // 前轮 / 后轮 z
const wheels=[];
function makeWheel(z, fender=false){
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.TorusGeometry(.62,.085,14,32),
    new THREE.MeshStandardMaterial({color:0x16181f, roughness:.85}));
  tire.castShadow=true; g.add(tire);
  const rimM = new THREE.Mesh(new THREE.TorusGeometry(.52,.035,8,32), chromeMat); g.add(rimM);
  const spokeM = new THREE.MeshStandardMaterial({color:0x9aa3b5, roughness:.3, metalness:.8});
  for(let i=0;i<6;i++){
    const s=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.96,6), spokeM);
    s.rotation.z=i*Math.PI/6; g.add(s);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.16,10), darkMat);
  hub.rotation.z=Math.PI/2; g.add(hub);
  g.rotation.y = Math.PI/2; g.position.set(0,.62,z); bike.add(g); wheels.push(g);
  if(fender){
    // 挡泥板必须固定在车架上，不能进转动的轮组（否则会跟着轮子转）
    const f=new THREE.Mesh(new THREE.TorusGeometry(.78,.045,8,20,Math.PI*.75),
      new THREE.MeshStandardMaterial({color:0xe63946, roughness:.4, metalness:.3}));
    f.rotation.y=Math.PI/2; f.rotation.z=Math.PI*.12;
    f.position.set(0,.72,z); f.castShadow=true; bike.add(f);
  }
  return g;
}
makeWheel(FZ, true); makeWheel(RZ, true);
// 菱形车架（前 -Z / 后 +Z）
{
  const BB  = new THREE.Vector3(0,.55,-.02);   // 五通
  const SEAT= new THREE.Vector3(0,1.32,.68);   // 座管顶
  const HEAD_T = new THREE.Vector3(0,1.32,-.82);// 头管顶
  const HEAD_B = new THREE.Vector3(0,1.00,-.98);// 头管底
  const REAR= new THREE.Vector3(0,.62,RZ);
  const FRONT=new THREE.Vector3(0,.62,FZ);
  tube(BB, SEAT, .055);                 // 立管
  tube(SEAT, HEAD_T, .055);             // 上管
  tube(BB, HEAD_B, .06);                // 下管
  tube(HEAD_T, HEAD_B, .07, darkMat);   // 头管
  tube(BB, REAR, .04, chromeMat);       // 后下叉
  tube(SEAT, REAR, .035, frameMat);     // 后上叉
  tube(HEAD_B, FRONT, .045, chromeMat); // 前叉
  tube(SEAT, new THREE.Vector3(0,1.52,.68), .04, chromeMat); // 座管
  tube(HEAD_T, new THREE.Vector3(0,1.58,-.95), .04, chromeMat); // 把立
}
// 牙盘 + 链条 + 曲柄
const crankL = new THREE.Group(), crankR = new THREE.Group();
{
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.05,24), chromeMat);
  ring.rotation.z=Math.PI/2; ring.position.set(.1,.55,-.02); bike.add(ring);
  const chain = new THREE.Mesh(new THREE.BoxGeometry(.04,.1,1.12),
    new THREE.MeshStandardMaterial({color:0x555c6e, roughness:.4, metalness:.7}));
  chain.position.set(.1,.585,.51); chain.rotation.x=.015; bike.add(chain);
  const mk=(g,side)=>{
    const arm=new THREE.Mesh(new THREE.BoxGeometry(.06,.4,.06),darkMat); arm.position.y=-.2; g.add(arm);
    const pedal=new THREE.Mesh(new THREE.BoxGeometry(.3,.06,.2),
      new THREE.MeshStandardMaterial({color:0x11131a, roughness:.8}));
    pedal.position.y=-.42; g.add(pedal);
    g.position.set(.24*side,.55,-.02); bike.add(g);
  };
  mk(crankL,1); mk(crankR,-1);
}
// 车把 + 车座 + 车筐
{
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,1.05,10), chromeMat);
  bar.rotation.z=Math.PI/2; bar.position.set(0,1.6,-.97); bar.castShadow=true; bike.add(bar);
  const gripM = new THREE.MeshStandardMaterial({color:0x2b2118, roughness:.9});
  [-.52,.52].forEach(x=>{
    const grip=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.22,10), gripM);
    grip.rotation.z=Math.PI/2; grip.position.set(x,1.6,-.97); bike.add(grip);
  });
  const seat = new THREE.Mesh(new THREE.BoxGeometry(.34,.13,.52),
    new THREE.MeshStandardMaterial({color:0x3a2b20, roughness:.75}));
  seat.position.set(0,1.56,.7); seat.castShadow=true; bike.add(seat);
  // 前车筐 + 露出两条鱼尾巴
  const basketM = new THREE.MeshStandardMaterial({color:0xb07a3f, roughness:.9});
  const basket = new THREE.Mesh(new THREE.BoxGeometry(.72,.36,.42), basketM);
  basket.position.set(0,1.28,-1.42); basket.castShadow=true; bike.add(basket);
  const rimB = new THREE.Mesh(new THREE.BoxGeometry(.78,.06,.48),
    new THREE.MeshStandardMaterial({color:0x8a5a28, roughness:.9}));
  rimB.position.set(0,1.48,-1.42); bike.add(rimB);
  // 尾灯（朝镜头，可爱红点）
  const tl = new THREE.Mesh(new THREE.SphereGeometry(.06,10,10),
    new THREE.MeshBasicMaterial({color:0xff2233}));
  tl.position.set(0,1.1,1.62); bike.add(tl);
}

// —— 鹈鹕 ——（面朝 -Z 向前骑，镜头从 +Z 看到的是背影 / 尾羽 / 围巾）
const pelican = new THREE.Group(); pelican.position.y = .35; player.add(pelican);
const white = new THREE.MeshStandardMaterial({color:0xf7f2e6, roughness:.85});
const gray  = new THREE.MeshStandardMaterial({color:0xc9d1e0, roughness:.8});
const darkF = new THREE.MeshStandardMaterial({color:0x495163, roughness:.8});
const orange= new THREE.MeshPhysicalMaterial({color:0xf6911f, roughness:.35, clearcoat:.5});
{
  // 躯干：胸 + 腹 + 背鞍（镜头主要看到背鞍，要有羽毛层次）
  const torso = new THREE.Mesh(new THREE.SphereGeometry(.62,24,18), white);
  torso.scale.set(1,.92,1.3); torso.position.set(0,1.68,.28); torso.castShadow=true; pelican.add(torso);

function solveLegs(){

/* ================= 音效（WebAudio 合成，无外部资源） ================= */
let AC=null;
function beep(freq=600, dur=.12, type='square', vol=.12){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

  hit(){ beep(160,.3,'sawtooth',.2); },
  over(){ [400,300,220,150].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle',.15),i*180)); },
  start(){ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle',.12),i*100)); }
};

function spawnRow(){
  // 保证至少留一条活路：随机选一个车道放鱼，其他车道按概率放障碍
  const fishLane = Math.floor(Math.random()*3);
  const z = -110;
  for(let lane=0; lane<3; lane++){
    const r = Math.random();
    if(lane===fishLane){
      const f=makeFish(); f.position.set(LANE_X[lane], 1.1+Math.random()*1.2, z - Math.random()*6);
      scene.add(f); pickups.push({mesh:f, lane, z:f.position.z, taken:false});
      if(Math.random()<.35){ // 偶尔双鱼
        const f2=makeFish(); f2.position.set(LANE_X[lane], 1.1, z-8);
        scene.add(f2); pickups.push({mesh:f2, lane, z:z-8, taken:false});
      }
    } else if(r < .42 + S.dist/8000){ // 难度随距离上涨
      const kind = Math.random()<.55 ? 'cone' : 'car';
      const m = kind==='car' ? makeCar([0xff5d8f,0x4cc9f0,0xb892ff,0x80ed99][Math.floor(Math.random()*4)]) : makeCone();
      m.position.set(LANE_X[lane], 0, z);
      // 汽车会轻微左右晃
      if(kind==='car') m.userData.wob = Math.random()*6;
      scene.add(m); obstacles.push({mesh:m, lane, z, type:kind, hit:false});
    }
  }
}

const clock = new THREE.Clock();
let spawnTimer = 0, t=0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  t += dt;

  // —— 环境动画（任何模式都动，菜单更有生气） ——
  dashes.forEach(d=>{ d.position.z += (S.mode==='play'?S.speed:6)*dt; if(d.position.z>20) d.position.z-=240; });
  waves.forEach((w,i)=>{ w.position.z += dt*2; w.material.opacity=.15+.1*Math.sin(t*2+i); if(w.position.z>25) w.position.z=-160; });
  clouds.forEach((c,i)=>{ c.position.x += Math.sin(t*.2+i)*dt*.5; });
  gulls.forEach(g=>{ const {l,r,ph}=g.userData; const f=Math.sin(t*8+ph)*.5;
    l.rotation.y=f; r.rotation.y=-f; g.position.x+=Math.sin(t*.5+ph)*dt*2; });
  palms.forEach((p,i)=>{ p.rotation.z=Math.sin(t*1.2+i)*.02; });
  scarfPts.forEach((s,i)=>{ s.rotation.y=-.15*i+Math.sin(t*10+i)*.25;
    s.position.z=.05+i*.34+Math.sin(t*10+i)*.06; s.position.y=2.42-i*.07+Math.sin(t*10+i*1.3)*.04; });

  if(S.mode==='play'){
    // 难度 & 分数
    S.dist += S.speed*dt;
    S.speed = Math.min(S.maxSpeed, S.baseSpeed + S.dist*.012);
    S.score += dt * S.speed * 1.2 * (S.combo>=3?1.5:1);
    if(S.comboTimer>0){ S.comboTimer-=dt; if(S.comboTimer<=0) S.combo=0; }
    if(S.invincible>0) S.invincible-=dt;

    // 生成
    spawnTimer -= dt*S.speed;
    if(spawnTimer<=0){ spawnRow(); spawnTimer=26; }

    // 玩家横移 + 跳跃物理
    player.position.x += (S.targetX - player.position.x)*Math.min(1,dt*10);
    player.rotation.z = (player.position.x - S.targetX)*.12;
    player.rotation.y = (player.position.x - S.targetX)*.15;
    if(S.y>0 || S.vy>0){ S.vy -= 26*dt; S.y += S.vy*dt; if(S.y<=0){ S.y=0; S.vy=0; } }
    const targetY = S.y + (S.crouch? -.25 : 0);
    player.position.y += (targetY - player.position.y)*Math.min(1,dt*14);
    // 压低时前倾（面朝 -Z，前倾为负）
    pelican.rotation.x = S.crouch? -.32 : (S.y>0? .16 : Math.sin(t*6)*.02);
    player.rotation.x = S.crouch? -.07 : 0;
    // 头部：转弯时探头看方向，跳跃时抬头
    if(pelican.userData.head){
      pelican.userData.head.rotation.y = -(player.position.x - S.targetX)*.6;
      pelican.userData.head.rotation.x = S.y>0? -.18 : Math.sin(t*3)*.05;
    }

    // 踩踏板 & 轮子 & 翅膀（折叠贴体，跳跃才张开扑腾）
    const pedalSpeed = S.speed*.9 + (S.y>0?4:0);
    crankL.rotation.z += pedalSpeed*dt; crankR.rotation.z = crankL.rotation.z+Math.PI;
    solveLegs();
    pelican.position.y = .35 + Math.abs(Math.sin(crankL.rotation.z))*.05 + S.y*.1;
    wheels.forEach(w=>{ w.rotation.x += S.speed*dt*1.4; });
    if(S.y > .05){
      const flap = Math.sin(t*20)*.8;
      wingL.rotation.z = -.95 - Math.abs(flap)*.45; wingR.rotation.z = .95 + Math.abs(flap)*.45;
      wingL.rotation.x = flap*.3; wingR.rotation.x = flap*.3;
    } else {
      const breathe = Math.sin(t*5)*.05;
      wingL.rotation.z = breathe; wingR.rotation.z = -breathe;
      wingL.rotation.x = S.speed*.002; wingR.rotation.x = S.speed*.002;
    }
    // 喉囊吃鱼后鼓起来
    pelican.userData.pouch.scale.setScalar(1 + Math.min(.5, S.combo*.06) + Math.sin(t*4)*.03);
    // 无敌闪烁
    pelican.visible = bike.visible = S.invincible>0 ? (Math.floor(t*12)%2===0) : true;
    // 相机跟随 + 受伤抖动
    if(S.shake>0) S.shake-=dt;
    const sh = S.shake>0 ? (Math.random()-.5)*.4*S.shake : 0;
    camera.position.x = player.position.x*.5 + 2.6 + sh;
    camera.position.y = 4.6 + S.y*.25 + sh*.5;
    camera.lookAt(player.position.x*.65, 1.6, -6);

    // 障碍物移动 & 碰撞
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      o.z += S.speed*dt; o.mesh.position.z=o.z;
      if(o.type==='car') o.mesh.position.x = LANE_X[o.lane]+Math.sin(t*2+o.mesh.userData.wob)*.3;
      if(o.z>14){ scene.remove(o.mesh); obstacles.splice(i,1); continue; }
      if(!o.hit && Math.abs(o.z)<1.6 && Math.abs(player.position.x-LANE_X[o.lane])<1.1){
        const needJump = o.type==='cone';
        const jumping = S.y > (needJump? .45 : .9);
        if(!jumping) { o.hit=true; hurt(); }
      }
    }
    // 鱼移动 & 拾取
    for(let i=pickups.length-1;i>=0;i--){
      const p=pickups[i];
      p.z += S.speed*dt; p.mesh.position.z=p.z;
      p.mesh.rotation.y += dt*2; p.mesh.position.y += Math.sin(t*3+i)*dt*.6;
      p.mesh.userData.ring.rotation.x += dt*1.5;
      if(p.z>14){ scene.remove(p.mesh); pickups.splice(i,1); continue; }
      if(!p.taken && Math.abs(p.z)<1.8 && Math.abs(player.position.x-LANE_X[p.lane])<1.3
         && Math.abs((S.y+1.4)-p.mesh.position.y)<1.4){
        p.taken=true; scene.remove(p.mesh); pickups.splice(i,1);
        S.fish++; S.combo++; S.comboTimer=3;
        S.score += 10 + S.combo*2;
        sfx.fish();
        if(S.combo>=3) showCombo(S.combo+' 连吃！ +'+(10+S.combo*2));
        updateHUD();
      }
    }
    // 每 100 分更新 HUD（避免每帧 DOM 操作）
    if(Math.floor(t*10)%2===0) updateHUD();
  } else {
    // 待机：鹈鹕原地蹬车卖萌
    crankL.rotation.z += 6*dt; crankR.rotation.z = crankL.rotation.z+Math.PI;
    solveLegs();
    wheels.forEach(w=>{ w.rotation.x += (S.mode==='over'?0:6)*dt; });
    wingL.rotation.z = Math.sin(t*2)*.05; wingR.rotation.z = -Math.sin(t*2)*.05;
    wingL.rotation.x = 0; wingR.rotation.x = 0;
    pelican.rotation.x = Math.sin(t*2)*.02;
    pelican.rotation.y = Math.sin(t*.8)*.1;
    if(pelican.userData.head) pelican.userData.head.rotation.y = Math.sin(t*.8)*.35;
    camera.position.x = 2.6+Math.sin(t*.3)*.5;
    camera.position.y = 4.6;
    camera.lookAt(0,1.6,-4);
  }

  renderer.render(scene, camera);
}
updateHUD();
animate();
</script>
</body>
</html>
